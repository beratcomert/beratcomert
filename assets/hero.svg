 <circle cx="78" cy="313" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/></circle>
 <text x="94" y="319" fill="#c8d4e9" font-family="monospace" font-size="14">FROM IDEA TO WORKING PRODUCT</text>
