 <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".2"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
 <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
